{% load i18n %}
<nav aria-label="{% translate 'Хлібні крихти' %}" class="vd-small vd-muted mb-3">
  <a href="{% url 'patterns:home' %}">{% translate "Головна" %}</a>
  {% for crumb in breadcrumbs %}
    <span class="vd-sep mx-1">◇</span>
    {% if forloop.last %}
      <span>{{ crumb.label }}</span>
    {% else %}
      <a href="{{ crumb.url }}">{{ crumb.label }}</a>
    {% endif %}
  {% endfor %}
</nav>
