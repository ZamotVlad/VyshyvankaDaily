{% load i18n %}
{% if page_obj.has_other_pages %}
  <nav class="vd-pagination" aria-label="{% translate 'Сторінки' %}">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}" aria-label="{% translate 'Попередня сторінка' %}">←</a>
    {% endif %}
    <span class="is-current">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}" aria-label="{% translate 'Наступна сторінка' %}">→</a>
    {% endif %}
  </nav>
{% endif %}
