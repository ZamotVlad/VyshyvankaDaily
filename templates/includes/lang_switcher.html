{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<div class="vd-lang mb-0">
  <a href="{{ lang_paths.uk|default:'/' }}" hreflang="uk" lang="uk" class="vd-lang__btn{% if CURRENT_LANGUAGE == 'uk' %} is-active{% endif %}"{% if CURRENT_LANGUAGE == 'uk' %} aria-current="true"{% endif %}>UA</a>
  <span class="vd-lang__sep" aria-hidden="true">/</span>
  <a href="{{ lang_paths.en|default:'/en/' }}" hreflang="en" lang="en" class="vd-lang__btn{% if CURRENT_LANGUAGE == 'en' %} is-active{% endif %}"{% if CURRENT_LANGUAGE == 'en' %} aria-current="true"{% endif %}>EN</a>
</div>
